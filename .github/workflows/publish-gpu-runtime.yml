name: Publish GPU Runtime

on:
  workflow_dispatch:
  push:
    branches:
      - codex/nebius-runtime
    paths:
      - "docker/gpu-runtime/**"
      - "scripts/validate_flash_attn.py"
      - "setup.py"
      - "stable_audio_tools/**"
      - ".github/workflows/publish-gpu-runtime.yml"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/pchordia/stable-audio-tools
          tags: |
            type=raw,value=gpu-runtime
            type=sha,prefix=gpu-runtime-,format=short

      - name: Build and push gpu runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/gpu-runtime/Dockerfile
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=gpu-runtime
          cache-to: type=gha,mode=max,scope=gpu-runtime
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
