name: Publish CPU Transcode

on:
  workflow_dispatch:
  push:
    branches:
      - codex/nebius-runtime
    paths:
      - "docker/cpu-transcode/**"
      - ".github/workflows/publish-cpu-transcode.yml"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/pchordia/stable-audio-tools
          tags: |
            type=raw,value=cpu-transcode
            type=sha,prefix=cpu-transcode-,format=short

      - name: Build and push cpu transcode image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/cpu-transcode/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
